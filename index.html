<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Terminal - Relaxation Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap');
        
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'VT323', monospace;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            text-shadow: 0 0 5px #0f0;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* --- ФОНОВЫЙ КАНВАС ДЛЯ АНИМАЦИИ --- */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: none;
            opacity: 0.6;
        }

        /* --- DARK THEME (КИБЕР-ТЕРМИНАЛ) --- */
        .crt::before {
            content: " "; display: block; position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }
        .scanline {
            width: 100%; height: 100px;
            background: linear-gradient(0deg, rgba(0,255,0,0) 0%, rgba(0,255,0,0.1) 50%, rgba(0,255,0,0) 100%);
            position: absolute; top: -100px; left: 0;
            animation: scanline 6s linear infinite; z-index: 3; pointer-events: none;
        }
        @keyframes scanline { 0% { top: -100px; } 100% { top: 100vh; } }
        
        .pulse-text { animation: textPulse 3s infinite alternate; }
        @keyframes textPulse { 0% { text-shadow: 0 0 5px #0f0; } 100% { text-shadow: 0 0 20px #0f0, 0 0 30px #0f0; } }

        /* --- LIGHT THEME (МЯГКИЙ СЕРЫЙ СТИЛЬ) --- */
        body.light-theme {
            background-color: #cbd5e0;
            color: #2d3748;
            text-shadow: none;
        }
        body.light-theme .crt::before, body.light-theme .scanline { display: none; }
        body.light-theme #bg-canvas { opacity: 0.3; } 
        
        body.light-theme .pulse-text { animation: textPulseLight 3s infinite alternate; }
        @keyframes textPulseLight { 0% { text-shadow: 0 0 2px #38b2ac; } 100% { text-shadow: 0 0 10px #38b2ac, 0 0 20px #38b2ac; } }

        body.light-theme .panel {
            background: rgba(237, 242, 247, 0.85); 
            backdrop-filter: blur(12px);
            border: 1px solid rgba(160, 174, 192, 0.8);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        body.light-theme button { 
            color: #2d3748; border-color: #718096; text-shadow: none; border-radius: 8px; font-weight: bold; background: #e2e8f0; 
        }
        
        body.light-theme input { color: #2d3748; border-color: #a0aec0; background: #fff; text-shadow: none; border-radius: 8px; }
        body.light-theme .border-green-500 { border-color: #a0aec0; }
        body.light-theme .text-yellow-400 { color: #dd6b20; font-weight: bold;}
        body.light-theme .game-canvas { border-color: #a0aec0; background-color: #1a202c; box-shadow: 0 8px 20px rgba(0,0,0,0.15); border-radius: 8px;}
        
        body.light-theme .minesweeper-grid, body.light-theme .tetris-grid, body.light-theme .next-piece-grid {
            background: #a0aec0; border-color: #a0aec0; box-shadow: 0 8px 20px rgba(0,0,0,0.1); border-radius: 4px; overflow: hidden;
        }
        body.light-theme .ms-cell { background: #e2e8f0; box-shadow: inset 0 0 4px rgba(0,0,0,0.1); color: #2d3748; }
        body.light-theme .ms-cell:hover { background: #cbd5e0; }
        body.light-theme .ms-cell.revealed { background: #f7fafc; box-shadow: none; }
        body.light-theme .tetris-cell { background: #edf2f7; }
        
        body.light-theme #game-over-overlay { background: rgba(226, 232, 240, 0.95); backdrop-filter: blur(5px); box-shadow: inset 0 0 100px rgba(229, 62, 62, 0.15); }

        /* --- БАЗОВЫЕ АНИМАЦИИ --- */
        .hidden { display: none !important; opacity: 0; pointer-events: none; } /* Глобальный фикс скрытия */

        .typewriter {
            overflow: hidden; border-right: .15em solid currentColor; white-space: nowrap; margin: 0 auto;
            animation: typing 1.5s steps(30, end), blink-caret .75s step-end infinite;
        }
        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: currentColor; } }
        
        @keyframes glitch-anim {
            0% { transform: translate(0) } 20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) } 60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) } 100% { transform: translate(0) }
        }
        
        .glitch-hover:hover { 
            animation: glitch-anim 0.2s linear infinite; 
            background: #0f0 !important; color: #000 !important; border-color: #0f0 !important;
        }
        body.light-theme .glitch-hover:hover { 
            animation: glitch-anim 0.2s linear infinite; 
            background: #38b2ac !important; color: #fff !important; border-color: #319795 !important;
        }

        .floating-score {
            position: absolute; color: #0f0; font-size: 2rem; font-weight: bold; text-shadow: 0 0 10px #0f0;
            pointer-events: none; animation: floatUpScore 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; z-index: 100;
        }
        body.light-theme .floating-score { color: #2b6cb0; text-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        @keyframes floatUpScore { 
            0% { opacity: 0; transform: translateY(10px) scale(0.5); } 
            20% { opacity: 1; transform: translateY(-10px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.5); } 
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in-up { animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.1s; } .delay-2 { animation-delay: 0.2s; } .delay-3 { animation-delay: 0.3s; }

        @keyframes iconBounce {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-5px) scale(1.1); }
            100% { transform: translateY(0) scale(1); }
        }
        .game-card:hover svg { animation: iconBounce 0.6s ease-in-out infinite; }

        .game-over-huge-text {
            color: #f00; text-shadow: 0 0 20px #f00, 2px 2px 0px #00f, -2px -2px 0px #0f0;
            font-size: 5rem; text-align: center; border: 4px solid #f00; padding: 40px; 
            background: rgba(255,0,0,0.1); text-transform: uppercase; animation: glitch-anim 0.15s linear infinite;
        }
        body.light-theme .game-over-huge-text {
            color: #e53e3e; border-color: #e53e3e; text-shadow: 3px 3px 0px rgba(0,0,0,0.05); background: rgba(229, 62, 62, 0.05);
        }

        /* --- БАЗОВЫЕ КЛАССЫ СЕТКИ И ИГР --- */
        .screen { position: relative; height: 100%; display: flex; flex-direction: column; z-index: 1; width: 100%; }
        .panel { border: 2px solid #0f0; background: rgba(0, 20, 0, 0.8); box-shadow: inset 0 0 15px #0f0; transition: all 0.4s ease; }
        button { color: #0f0; background: transparent; border: 1px solid #0f0; padding: 8px 20px; font-family: 'VT323', monospace; font-size: 1.5rem; cursor: pointer; transition: all 0.3s ease; }
        button:hover { background: #0f0; color: #000; }
        input { background: transparent; border: 1px solid #0f0; color: #0f0; font-family: 'VT323', monospace; font-size: 1.5rem; padding: 10px; outline: none; width: 100%; margin-bottom: 15px; transition: all 0.3s ease;}
        input::placeholder { color: inherit; opacity: 0.5; }
        
        .game-canvas { border: 2px solid #0f0; image-rendering: pixelated; background-color: #000; transition: border-color 0.3s; }
        .minesweeper-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; background: #0f0; border: 2px solid #0f0; width: fit-content; margin: 0 auto; transition: all 0.3s;}
        .ms-cell { width: 40px; height: 40px; background: #002200; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; font-weight: bold; user-select: none; box-shadow: inset 0 0 5px #0f0; transition: all 0.1s;}
        .ms-cell:hover { background: #004400; }
        .ms-cell.revealed { background: #000; box-shadow: none; cursor: default; }
        .tetris-grid { display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(20, 1fr); gap: 1px; background: #0f0; border: 2px solid #0f0; width: 300px; height: 600px; margin: 0 auto; transition: all 0.3s;}
        .tetris-cell { background: #002200; transition: background-color 0.1s; }
        .next-piece-grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 1px; background: #0f0; width: 120px; height: 120px; margin: 0 auto; transition: all 0.3s;}
        
        .t-c-0 { background: #FF3366 !important; box-shadow: inset 0 0 10px rgba(255,51,102,0.8) !important; } 
        .t-c-1 { background: #33CCFF !important; box-shadow: inset 0 0 10px rgba(51,204,255,0.8) !important; } 
        .t-c-2 { background: #9933FF !important; box-shadow: inset 0 0 10px rgba(153,51,255,0.8) !important; } 
        .t-c-3 { background: #FFFF33 !important; box-shadow: inset 0 0 10px rgba(255,255,51,0.8) !important; } 
        .t-c-4 { background: #33FF33 !important; box-shadow: inset 0 0 10px rgba(51,255,51,0.8) !important; } 

        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        #game-over-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(10, 0, 0, 0.95); z-index: 100; display: none;
            flex-direction: column; justify-content: center; align-items: center; box-shadow: inset 0 0 150px rgba(255, 0, 0, 0.5);
            transition: all 0.3s;
        }
        .leaderboard-table { width: 100%; border-collapse: collapse; font-size: 1.3rem; }
        .leaderboard-table th, .leaderboard-table td { border: 1px solid currentColor; padding: 10px; text-align: left; opacity: 0.8; transition: border-color 0.3s;}
        .leaderboard-table th { background: rgba(128, 128, 128, 0.2); }

        /* --- SURVIVOR SPECIFIC STYLES --- */
        #survivor-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; font-family: 'Fira Code', monospace;}
        .sv-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; backdrop-filter: blur(5px); transition: 0.3s;}
        body.light-theme .sv-overlay { background: rgba(255, 255, 255, 0.85); }
        .sv-card { background: #1e293b; border: 2px solid #475569; border-radius: 12px; width: 220px; padding: 20px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; text-align: center; color: #fff;}
        .sv-card:hover { transform: translateY(-5px); border-color: #22d3ee; box-shadow: 0 10px 20px rgba(34,211,238,0.2);}
        body.light-theme .sv-card { background: #edf2f7; border-color: #cbd5e0; color: #2d3748; }
        body.light-theme .sv-card:hover { border-color: #38b2ac; box-shadow: 0 10px 20px rgba(56,178,172,0.2); }
        .sv-card-level { background: #0f172a; padding: 4px 8px; border-radius: 6px; font-size: 12px; color: #38bdf8; margin-top: 10px;}
        body.light-theme .sv-card-level { background: #fff; color: #319795; }
        .sv-evo-card { background: #2e1065; border-color: #c084fc; }
        body.light-theme .sv-evo-card { background: #faf5ff; border-color: #d6bcfa; }

        #auth-screen, #dashboard-screen, #game-screen { display: none; }
        #auth-screen.active, #dashboard-screen.active, #game-screen.active { display: flex; }
    </style>
</head>
<body class="crt">
    <canvas id="bg-canvas"></canvas>
    <div class="scanline"></div>
    
    <!-- ЭКРАН ВХОДА -->
    <div id="auth-screen" class="screen active items-center justify-center p-4">
        <div class="panel p-10 max-w-lg w-full text-center fade-in-up">
            <h1 class="text-6xl mb-4 typewriter w-fit pulse-text">SUPPORT.OS</h1>
            <p class="mb-8 text-xl opacity-80 delay-1 fade-in-up" style="animation-fill-mode: forwards;">v7.5 / SECURE LOGIN</p>
            <form id="auth-form" onsubmit="handleAuth(event)" class="delay-2 fade-in-up" style="animation-fill-mode: forwards;">
                <input type="text" id="username" placeholder="Логин инженера" required>
                <input type="password" id="password" placeholder="Пароль доступа" required minlength="6">
                <div class="flex gap-4 mt-6 justify-center">
                    <button type="submit" id="btn-login" class="w-full glitch-hover">АВТОРИЗАЦИЯ</button>
                </div>
                <p id="auth-error" class="text-red-500 mt-6 text-xl blink"></p>
            </form>
        </div>
    </div>

    <!-- ДАШБОРД (НА ВЕСЬ ЭКРАН) -->
    <div id="dashboard-screen" class="screen flex-col p-6 h-full w-full">
        <header class="flex justify-between items-center mb-6 panel p-4 fade-in-up">
            <div class="text-3xl">SUPPORT_DASHBOARD <span id="user-display-name" class="text-yellow-400 ml-4"></span></div>
            <div class="flex gap-4">
                <button onclick="toggleTheme()" id="theme-btn" class="text-sm">[ THEME: DARK ]</button>
                <button onclick="logout()">[ LOGOUT ]</button>
            </div>
        </header>

        <div class="flex gap-6 h-full overflow-hidden pb-6 w-full">
            <!-- Выбор игры -->
            <div class="panel flex-1 p-8 flex flex-col items-center justify-center relative fade-in-up delay-1">
                <h2 class="text-5xl mb-8 border-b-2 border-green-500 pb-4 pulse-text">RELAXATION_PROTOCOL</h2>
                <div class="grid grid-cols-2 gap-6 w-full max-w-4xl">
                    <button onclick="startGame('snake')" class="game-card fade-in-up delay-2 flex items-center gap-4 text-3xl py-6 px-6 glitch-hover border border-green-500">
                        <svg class="w-10 h-10 fill-current" viewBox="0 0 24 24"><path d="M3 3h4v4H3V3zm6 4h4v4H9V7zm6 4h4v4h-4v-4zm0 6h4v4h-4v-4zm4 0h-4v-4h4v4z"/></svg>
                        <span>> SNAKE.sh</span>
                    </button>
                    <button onclick="startGame('tetris')" class="game-card fade-in-up delay-2 flex items-center gap-4 text-3xl py-6 px-6 glitch-hover border border-green-500">
                        <svg class="w-10 h-10 fill-current" viewBox="0 0 24 24"><path d="M4 4h4v4H4V4zm6 0h4v4h-4V4zm6 0h4v4h-4V4zm-6 6h4v4h-4v-4z"/></svg>
                        <span>> TETRIS.bat</span>
                    </button>
                    <button onclick="startGame('minesweeper')" class="game-card fade-in-up delay-3 flex items-center gap-4 text-3xl py-6 px-6 glitch-hover border border-green-500">
                        <svg class="w-10 h-10 fill-none stroke-current" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="13" r="7"/><path d="M16 8l3-3M19 5a2 2 0 0 0-2-2M21 5h-2M19 3v2"/></svg>
                        <span>> MINESWEEP</span>
                    </button>
                    <button onclick="startGame('bricks')" class="game-card fade-in-up delay-3 flex items-center gap-4 text-3xl py-6 px-6 glitch-hover border border-green-500">
                        <svg class="w-10 h-10 fill-none stroke-current" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="4"/><rect x="8" y="20" width="8" height="2"/><circle cx="12" cy="14" r="2"/></svg>
                        <span>> BRICKS.exe</span>
                    </button>
                    <button onclick="startGame('dino')" class="game-card fade-in-up delay-3 flex items-center gap-4 text-3xl py-6 px-6 glitch-hover border border-green-500">
                        <svg class="w-10 h-10 fill-current" viewBox="0 0 24 24"><path d="M14 2h6v2h-2v2h2v2h-2v2h-2v2h-2v4h-2v4h-2v2H8v-2H6v-4h2v-2h2v-4h2V2h2zm2 2v2h2V4h-2z"/></svg>
                        <span>> DINO.exe</span>
                    </button>
                    <button onclick="startGame('survivor')" class="game-card fade-in-up delay-3 flex items-center gap-4 text-3xl py-6 px-6 glitch-hover border border-green-500">
                        <svg class="w-10 h-10 fill-current" viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 4l7.5 15h-15L12 6z"/></svg>
                        <span>> SURVIVOR</span>
                    </button>
                </div>
            </div>

            <!-- Таблица лидеров -->
            <div class="panel w-[500px] p-6 flex flex-col h-full shrink-0 fade-in-up delay-2">
                <div class="flex justify-between items-center border-b-2 border-green-500 pb-4 mb-4">
                    <h2 class="text-3xl">LEADERBOARD</h2>
                    <button id="admin-reset-btn" class="hidden text-sm border-red-500 text-red-500 hover:bg-red-500 hover:text-white" onclick="resetLeaderboard()">[ СБРОСИТЬ БАЗУ ]</button>
                </div>
                <div class="flex flex-wrap gap-2 mb-4" id="lb-tabs">
                    <button class="text-sm py-1 px-2 flex-1 bg-green-900 !text-white border-green-900" onclick="loadLeaderboard('snake')">SNAKE</button>
                    <button class="text-sm py-1 px-2 flex-1" onclick="loadLeaderboard('tetris')">TETRIS</button>
                    <button class="text-sm py-1 px-2 flex-1" onclick="loadLeaderboard('minesweeper')">MINES</button>
                    <button class="text-sm py-1 px-2 flex-1" onclick="loadLeaderboard('bricks')">BRICKS</button>
                    <button class="text-sm py-1 px-2 flex-1" onclick="loadLeaderboard('dino')">DINO</button>
                    <button class="text-sm py-1 px-2 flex-1" onclick="loadLeaderboard('survivor')">SURVIV</button>
                </div>
                <div class="overflow-y-auto flex-1 mt-2">
                    <table class="leaderboard-table w-full">
                        <thead>
                            <tr><th>#</th><th>ОПЕРАТОР</th><th>СЧЕТ</th></tr>
                        </thead>
                        <tbody id="leaderboard-body">
                            <tr><td colspan="3" class="text-center blink">LOADING...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- ЭКРАН ИГРЫ -->
    <div id="game-screen" class="screen items-center justify-center p-4">
        <div class="panel p-8 flex flex-col items-center max-w-5xl w-full fade-in-up">
            <div class="flex justify-between w-full mb-6 relative z-20">
                <div class="text-3xl">SCORE: <span id="score">0</span></div>
                <div id="game-title" class="text-4xl font-bold pulse-text">GAME</div>
                <div class="flex gap-4">
                    <button onclick="togglePause()" style="color: #d69e2e; border-color: #d69e2e;">[ PAUSE (P) ]</button>
                    <button onclick="exitGame()">[ TERMINATE ]</button>
                </div>
            </div>
            
            <div class="flex gap-8 items-start relative">
                <div id="game-container" class="relative"></div>
                <div id="floating-scores-layer" class="absolute top-0 left-0 w-full h-full pointer-events-none z-30"></div>

                <div id="tetris-sidebar" style="display: none;" class="panel p-4 text-center">
                    <div class="mb-4 text-2xl">NEXT PIECE:</div>
                    <div id="next-piece-container" class="next-piece-grid"></div>
                </div>
            </div>
            <div id="pause-msg" class="text-4xl blink mt-6" style="display:none; color: #d69e2e; text-shadow: 0 0 15px #d69e2e;">SYSTEM PAUSED</div>
        </div>
    </div>

    <!-- ПОЛНОЭКРАННЫЙ ОВЕРЛЕЙ ПРОИГРЫША -->
    <div id="game-over-overlay">
        <div class="game-over-huge-text">ЗАЯВКА ПО ЭЦП<br>ВНЕ ОЧЕРЕДИ</div>
        <div class="mt-8 text-4xl opacity-80">FINAL SCORE: <span id="final-score-display" class="font-bold" style="opacity: 1 !important;">0</span></div>
        <div class="flex gap-6 mt-12">
            <button onclick="restartCurrentGame()" class="text-3xl border-red-500 text-red-500 hover:bg-red-500 hover:text-white py-4 px-8 glitch-hover">[ REBOOT SYSTEM ]</button>
            <button onclick="exitGame()" class="text-3xl py-4 px-8 glitch-hover">[ EXIT TO MENU ]</button>
        </div>
    </div>

    <!-- ФОНОВАЯ МАТРИЧНАЯ АНИМАЦИЯ -->
    <script>
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight;
        const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ'.split('');
        const fontSize = 16; const columns = bgCanvas.width / fontSize;
        const drops = []; for(let x = 0; x < columns; x++) drops[x] = 1;
        
        function drawBg() {
            bgCtx.fillStyle = document.body.classList.contains('light-theme') ? 'rgba(203, 213, 224, 0.1)' : 'rgba(0, 0, 0, 0.1)';
            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
            bgCtx.fillStyle = document.body.classList.contains('light-theme') ? '#a0aec0' : '#0f0';
            bgCtx.font = fontSize + 'px monospace';
            for(let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                bgCtx.fillText(text, i * fontSize, drops[i] * fontSize);
                if(drops[i] * fontSize > bgCanvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawBg, 50);

    <script>
        // ИДЕАЛЬНАЯ ОЧИСТКА ПАМЯТИ (Фикс бага с поломкой всех игр)
        let activeGameListeners = [];
        function addGameListener(type, func, options=false) {
            document.addEventListener(type, func, options);
            activeGameListeners.push({type, func, options});
        }
        function clearGameListeners() {
            activeGameListeners.forEach(l => document.removeEventListener(l.type, l.func, l.options));
            activeGameListeners = [];
        }

        let isLightMode = false;
        function toggleTheme() {
            isLightMode = !isLightMode;
            document.body.classList.toggle('light-theme', isLightMode);
            document.getElementById('theme-btn').innerText = isLightMode ? '[ THEME: LIGHT ]' : '[ THEME: DARK ]';
            
            const tabs = document.getElementById('lb-tabs').children;
            for(let tab of tabs) {
                if(tab.classList.contains('bg-green-900') || tab.style.background !== 'transparent') {
                    if (isLightMode) { tab.style.background = '#38b2ac'; tab.style.borderColor = '#38b2ac'; tab.style.color = '#fff'; }

        window.addEventListener("keydown", function(e) {
            if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {

            if(!usernameInput) { errorEl.innerText = "ОШИБКА: ЛОГИН ПУСТ"; return; }

            catch (error) { errorEl.innerText = "ОШИБКА ДОСТУПА. ПРОВЕРЬТЕ ДАННЫЕ."; }
        }

        async function logout() { await window.firebaseAPI.signOut(window.auth); }

        async function saveScore(gameName, score) {
            if (!window.auth.currentUser || score <= 0) return;

                const username = window.auth.currentUser.email.split('@')[0];
                const docRef = window.firebaseAPI.doc(window.db, "leaderboards", gameName, "scores", username);
                const docSnap = await window.firebaseAPI.getDoc(docRef);
                if (docSnap.exists() && docSnap.data().score >= score) return; 
                await window.firebaseAPI.setDoc(docRef, { username: username, score: score, timestamp: window.firebaseAPI.serverTimestamp() });
                loadLeaderboard(gameName); 
            } catch (e) { console.error("Error saving score", e); }

        async function loadLeaderboard(gameName) {
            currentLbGame = gameName;
            const tabs = document.getElementById('lb-tabs').children;
            for(let tab of tabs) { 
                tab.style.background = 'transparent'; 
                tab.classList.remove('bg-green-900', '!text-white', 'border-green-900'); 
                tab.style.color = ''; tab.style.borderColor = '';
            }
            let activeTab = event?.target ? event.target : tabs[0];
            activeTab.classList.add('!text-white');
            
            if (isLightMode) { activeTab.style.background = '#38b2ac'; activeTab.style.borderColor = '#38b2ac'; }
            else { activeTab.style.background = '#14532d'; activeTab.style.borderColor = '#14532d'; }

                    const data = doc.data(); tbody.innerHTML += `<tr><td>#${rank}</td><td>${data.username}</td><td>${data.score}</td></tr>`; rank++;

        function spawnFloatingScore(x, y, text) {
            const layer = document.getElementById('floating-scores-layer'); const el = document.createElement('div');
            el.className = 'floating-score'; el.innerText = text; el.style.left = x + 'px'; el.style.top = y + 'px';
            layer.appendChild(el); setTimeout(() => el.remove(), 1000);
        }

        let currentGame = null; let gameLoop = null; let score = 0; let isPaused = false; let isGameOver = false;

        function startGame(game) {
            clearGameListeners(); // ОЧИСТКА ВСЕХ СТАРЫХ КНОПОК
            currentGame = game; isPaused = false; isGameOver = false; score = 0;
            document.getElementById('score').innerText = score; document.getElementById('game-title').innerText = game.toUpperCase();
            document.getElementById('game-over-overlay').style.display = 'none'; document.getElementById('pause-msg').style.display = 'none';
            document.getElementById('tetris-sidebar').style.display = game === 'tetris' ? 'block' : 'none';

            const container = document.getElementById('game-container'); container.innerHTML = ''; switchScreen('game-screen');
            if(game === 'snake') initSnake(container); if(game === 'tetris') initTetris(container);
            if(game === 'minesweeper') initMinesweeper(container); if(game === 'bricks') initBricks(container);
            if(game === 'dino') initDino(container);
            if(game === 'survivor') initSurvivor(container);
        }

        function togglePause() {
            if (isGameOver) return;
            isPaused = !isPaused; document.getElementById('pause-msg').style.display = isPaused ? 'block' : 'none';
        }
        document.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'p' && document.getElementById('game-screen').classList.contains('active')) togglePause(); });

        function gameOver() {
            isGameOver = true; document.getElementById('final-score-display').innerText = score; document.getElementById('game-over-overlay').style.display = 'flex';
            if(gameLoop) { cancelAnimationFrame(gameLoop); clearTimeout(gameLoop); clearInterval(gameLoop); } saveScore(currentGame, score);
        }
        function restartCurrentGame() { clearGameListeners(); document.getElementById('game-over-overlay').style.display = 'none'; startGame(currentGame); }
        function exitGame() { clearGameListeners(); document.getElementById('game-over-overlay').style.display = 'none'; if(gameLoop) { cancelAnimationFrame(gameLoop); clearTimeout(gameLoop); clearInterval(gameLoop); } switchScreen('dashboard-screen'); }

        // --- DINO ---
        function initDino(container) {
            const canvas = document.createElement('canvas'); canvas.width = 700; canvas.height = 300; canvas.className = 'game-canvas'; container.appendChild(canvas);
            const ctx = canvas.getContext('2d');
            let gameSpeed = 2.0; let scoreCounter = 0;
            let dino = { x: 50, y: 200, w: 30, h: 40, dy: 0, gravity: 0.4, jumpPower: -11, grounded: true, ducking: false };
            let obstacles = []; const groundY = 240; let spawnTimer = 100;

            addGameListener('keydown', (e) => {
                if(currentGame !== 'dino' || isPaused || isGameOver) return;
                if ((e.code === 'Space' || e.code === 'ArrowUp') && dino.grounded) { dino.dy = dino.jumpPower; dino.grounded = false; }
                if (e.code === 'ArrowDown') { dino.ducking = true; dino.h = 20; if(dino.grounded) dino.y = groundY - dino.h; }
            });
            addGameListener('keyup', (e) => {
                if(currentGame !== 'dino' || isPaused || isGameOver) return;
                if (e.code === 'ArrowDown') { dino.ducking = false; dino.h = 40; if(dino.grounded) dino.y = groundY - dino.h; }
            });

            function loop() {
                if(currentGame !== 'dino') return; gameLoop = requestAnimationFrame(loop);
                if(isPaused || isGameOver) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                dino.dy += dino.gravity; if(dino.ducking && !dino.grounded) dino.dy += 2.0; dino.y += dino.dy;
                if(dino.y + dino.h >= groundY) { dino.y = groundY - dino.h; dino.dy = 0; dino.grounded = true; } else { dino.grounded = false; }

                scoreCounter++;
                if(scoreCounter % 15 === 0) {
                    score++; document.getElementById('score').innerText = score;
                    if (score % 150 === 0 && gameSpeed < 10) { gameSpeed += 0.2; spawnFloatingScore(dino.x, dino.y - 20, 'SPEED UP!'); }
                }

                ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(canvas.width, groundY); ctx.strokeStyle = isLightMode ? '#718096' : '#0f0'; ctx.lineWidth = 2; ctx.stroke();
                for(let i = 0; i < canvas.width; i+=30) { if((i + scoreCounter * gameSpeed) % 60 < 30) { ctx.fillStyle = isLightMode ? '#718096' : '#0f0'; ctx.fillRect(i, groundY+5, 4, 2); } }

                ctx.fillStyle = isLightMode ? '#38b2ac' : '#0f0'; ctx.fillRect(dino.x, dino.y, dino.w, dino.h);
                ctx.fillStyle = isLightMode ? '#fff' : '#000'; ctx.fillRect(dino.x + 20, dino.y + 6, 4, 4); 

                spawnTimer--;
                if (spawnTimer <= 0) {
                    let type = Math.random() > 0.7 && score > 50 ? 'flying' : 'ground';
                    if (type === 'ground') { let width = Math.random() > 0.5 ? 20 : 35; obstacles.push({ x: canvas.width, y: groundY - 45, w: width, h: 45, type }); } 
                    else { let heights = [groundY - 80, groundY - 50, groundY - 30]; let h = heights[Math.floor(Math.random() * heights.length)]; obstacles.push({ x: canvas.width, y: h, w: 35, h: 15, type }); }
                    let minGap = 280 + (gameSpeed * 10); let maxGap = 500 + (gameSpeed * 15);
                    spawnTimer = (Math.random() * (maxGap - minGap) + minGap) / gameSpeed; 
                }

                for (let i = 0; i < obstacles.length; i++) {
                    let obs = obstacles[i]; obs.x -= gameSpeed;
                    if (obs.type === 'ground') {
                        ctx.fillStyle = isLightMode ? '#4a5568' : '#0f0'; ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                        ctx.strokeStyle = isLightMode ? '#fff' : '#000'; ctx.lineWidth = 1;
                        ctx.strokeRect(obs.x, obs.y, obs.w, obs.h); ctx.strokeRect(obs.x, obs.y + 15, obs.w, 15);
                    } else { ctx.fillStyle = '#e53e3e'; ctx.fillRect(obs.x, obs.y, obs.w, obs.h); }
                    
                    let hitBoxMargin = 5; 
                    if (dino.x + hitBoxMargin < obs.x + obs.w - hitBoxMargin && dino.x + dino.w - hitBoxMargin > obs.x + hitBoxMargin && 
                        dino.y + hitBoxMargin < obs.y + obs.h - hitBoxMargin && dino.y + dino.h - hitBoxMargin > obs.y + hitBoxMargin) { gameOver(); return; }
                }
                obstacles = obstacles.filter(obs => obs.x + obs.w > 0);
            }
            loop();
        }

        // --- ЗМЕЙКА ---
        function initSnake(container) {
            const canvas = document.createElement('canvas'); canvas.width = 500; canvas.height = 500; canvas.className = 'game-canvas'; container.appendChild(canvas);
            const ctx = canvas.getContext('2d'); const grid = 25; let count = 0;
            let snake = { x: 200, y: 200, dx: grid, dy: 0, cells: [], maxCells: 4 }; let apple = { x: 375, y: 375 };
            const speedDelay = 30; 
            function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min)) + min; }
            addGameListener('keydown', function snakeController(e) {
                if(currentGame !== 'snake' || isPaused || isGameOver) return;
                if (e.which === 37 && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
                else if (e.which === 38 && snake.dy === 0) { snake.dy = -grid; snake.dx = 0; }
                else if (e.which === 39 && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
                else if (e.which === 40 && snake.dy === 0) { snake.dy = grid; snake.dx = 0; }
            });
            function loop() {
                if(currentGame !== 'snake') return; gameLoop = requestAnimationFrame(loop);
                if (isPaused || isGameOver) return; if (++count < speedDelay) return; count = 0;
                ctx.clearRect(0,0,canvas.width,canvas.height);
                snake.x += snake.dx; snake.y += snake.dy;
                if (snake.x < 0 || snake.x >= canvas.width || snake.y < 0 || snake.y >= canvas.height) { gameOver(); return; }
                snake.cells.unshift({x: snake.x, y: snake.y}); if (snake.cells.length > snake.maxCells) snake.cells.pop();
                ctx.fillStyle = '#e53e3e'; ctx.fillRect(apple.x, apple.y, grid-1, grid-1); 
                ctx.fillStyle = isLightMode ? '#38b2ac' : '#0f0';
                snake.cells.forEach(function(cell, index) {
                    ctx.fillRect(cell.x, cell.y, grid-1, grid-1);
                    if (cell.x === apple.x && cell.y === apple.y) {
                        snake.maxCells++; score += 10; document.getElementById('score').innerText = score; spawnFloatingScore(apple.x, apple.y, '+10');
                        apple.x = getRandomInt(0, 20) * grid; apple.y = getRandomInt(0, 20) * grid;
                    }
                    for (let i = index + 1; i < snake.cells.length; i++) { if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) gameOver(); }
                });
            }
            gameLoop = requestAnimationFrame(loop);
        }

        // --- ЦВЕТНОЙ ТЕТРИС ---
        function initTetris(container) {
            const grid = document.createElement('div'); grid.className = 'tetris-grid'; container.appendChild(grid);
            const nextPieceGrid = document.getElementById('next-piece-container');
            let cells = Array.from({length: 200}, () => { let div = document.createElement('div'); div.className = 'tetris-cell'; grid.appendChild(div); return div; });
            let nextPieceCells = Array.from({length: 16}, () => { let div = document.createElement('div'); div.className = 'tetris-cell'; nextPieceGrid.appendChild(div); return div; });
            const width = 10;
            const lTetromino = [[1, width+1, width*2+1, 2], [width, width+1, width+2, width*2+2], [1, width+1, width*2+1, width*2], [width, width*2, width*2+1, width*2+2]];
            const zTetromino = [[0,width,width+1,width*2+1],[width+1, width+2,width*2,width*2+1],[0,width,width+1,width*2+1],[width+1, width+2,width*2,width*2+1]];
            const tTetromino = [[1,width,width+1,width+2],[1,width+1,width+2,width*2+1],[width,width+1,width+2,width*2+1],[1,width,width+1,width*2+1]];
            const oTetromino = [[0,1,width,width+1],[0,1,width,width+1],[0,1,width,width+1],[0,1,width,width+1]];
            const iTetromino = [[1,width+1,width*2+1,width*3+1],[width,width+1,width+2,width+3],[1,width+1,width*2+1,width*3+1],[width,width+1,width+2,width+3]];
            const theTetrominoes = [lTetromino, zTetromino, tTetromino, oTetromino, iTetromino];
            
            let currentPosition = 4; let currentRotation = 0;
            let random = Math.floor(Math.random()*theTetrominoes.length); let nextRandom = Math.floor(Math.random()*theTetrominoes.length);
            let current = theTetrominoes[random][currentRotation];
            let inputLocked = false; 

            function draw() { current.forEach(index => cells[currentPosition + index].classList.add('filled', 't-c-' + random)); }
            function undraw() { current.forEach(index => cells[currentPosition + index].classList.remove('filled', 't-c-' + random)); }
            function displayNextPiece() {
                nextPieceCells.forEach(cell => { cell.className = 'tetris-cell'; });
                const nextTetromino = theTetrominoes[nextRandom][0]; let offset = nextRandom === 3 ? 1 : 0;
                nextTetromino.forEach(index => {
                    let nextIndex = (Math.floor(index/width) * 4) + (index % width) + offset;
                    if(nextPieceCells[nextIndex]) nextPieceCells[nextIndex].classList.add('filled', 't-c-' + nextRandom);
                });
            }
            displayNextPiece();
            
            addGameListener('keydown', function control(e) {
                if(currentGame !== 'tetris' || isPaused || isGameOver || inputLocked) return;
                if(e.keyCode === 32 && e.repeat) return; 
                
                if(e.keyCode === 37) moveLeft(); 
                else if(e.keyCode === 38) rotate(); 
                else if(e.keyCode === 39) moveRight(); 
                else if(e.keyCode === 40) moveDown(); 
                else if(e.keyCode === 32) { 
                    while(!current.some(index => cells[currentPosition + index + width]?.classList.contains('taken') || currentPosition + index + width >= 200)) { 
                        undraw(); currentPosition += width; draw(); 
                    } 
                    freeze(); 
                }
            });
            
            function moveDown() { if (isPaused || isGameOver || inputLocked) return; undraw(); currentPosition += width; draw(); freeze(); }
            
            function freeze() {
                if(current.some(index => cells[currentPosition + index + width]?.classList.contains('taken') || currentPosition + index + width >= 200)) {
                    current.forEach(index => cells[currentPosition + index].classList.add('taken', 't-c-' + random));
                    addScore(); 
                    inputLocked = true; setTimeout(() => { inputLocked = false; }, 150);
                    random = nextRandom; nextRandom = Math.floor(Math.random()*theTetrominoes.length);
                    current = theTetrominoes[random][currentRotation]; currentPosition = 4; displayNextPiece(); draw(); 
                    if(current.some(index => cells[currentPosition + index].classList.contains('taken'))) gameOver();
                }
            }
            
            function moveLeft() { undraw(); if(!current.some(index => (currentPosition + index) % width === 0)) currentPosition -=1; if(current.some(index => cells[currentPosition + index].classList.contains('taken'))) currentPosition +=1; draw(); }
            function moveRight() { undraw(); if(!current.some(index => (currentPosition + index) % width === width -1)) currentPosition +=1; if(current.some(index => cells[currentPosition + index].classList.contains('taken'))) currentPosition -=1; draw(); }
            function rotate() { undraw(); currentRotation = (currentRotation + 1) % current.length; current = theTetrominoes[random][currentRotation]; draw(); }
            function addScore() {
                for (let i = 0; i < 199; i +=width) {
                    const row = [i, i+1, i+2, i+3, i+4, i+5, i+6, i+7, i+8, i+9];
                    if(row.every(index => cells[index].classList.contains('taken'))) {
                        score += 100; document.getElementById('score').innerText = score; spawnFloatingScore(100, 300, '+100'); 
                        row.forEach(index => { cells[index].className = 'tetris-cell'; });
                        const squaresRemoved = cells.splice(i, width); cells = squaresRemoved.concat(cells);
                        cells.forEach(cell => grid.appendChild(cell));
                    }
                }
            }
            gameLoop = setInterval(() => { if(!isPaused && !isGameOver && !inputLocked) moveDown(); }, 800);
        }

        // --- САПЕР ---
        function initMinesweeper(container) {
            const grid = document.createElement('div'); grid.className = 'minesweeper-grid'; container.appendChild(grid);
            const width = 10; const bombAmount = 10; let squares = [];
            const gameArray = Array(width*width - bombAmount).fill('valid').concat(Array(bombAmount).fill('bomb')).sort(() => Math.random() - 0.5);
            for(let i=0; i<width*width; i++) {
                const square = document.createElement('div'); square.setAttribute('id', i); square.classList.add('ms-cell', gameArray[i]); grid.appendChild(square); squares.push(square);
                square.addEventListener('click', function(e) { if(isPaused || isGameOver || square.classList.contains('flagged')) return; click(square); });
                square.addEventListener('contextmenu', function(e) {
                    e.preventDefault(); if(isPaused || isGameOver || square.classList.contains('revealed')) return;
                    if(!square.classList.contains('flagged')) { square.classList.add('flagged'); square.innerText = '🚩'; } else { square.classList.remove('flagged'); square.innerText = ''; }
                });
            }
            for(let i=0; i<squares.length; i++) {
                let total = 0; const isLeftEdge = (i % width === 0); const isRightEdge = (i % width === width - 1);
                if(squares[i].classList.contains('valid')) {
                    if (i > 0 && !isLeftEdge && squares[i -1].classList.contains('bomb')) total++;
                    if (i > 9 && !isRightEdge && squares[i +1 -width].classList.contains('bomb')) total++;
                    if (i > 10 && squares[i -width].classList.contains('bomb')) total++;
                    if (i > 11 && !isLeftEdge && squares[i -1 -width].classList.contains('bomb')) total++;
                    if (i < 98 && !isRightEdge && squares[i +1].classList.contains('bomb')) total++;
                    if (i < 90 && !isLeftEdge && squares[i -1 +width].classList.contains('bomb')) total++;
                    if (i < 88 && !isRightEdge && squares[i +1 +width].classList.contains('bomb')) total++;
                    if (i < 89 && squares[i +width].classList.contains('bomb')) total++;
                    squares[i].setAttribute('data', total);
                }
            }
            function click(square) {
                if (square.classList.contains('revealed')) return;
                if (square.classList.contains('bomb')) { gameOver(); return; }
                let total = square.getAttribute('data');
                if (total != 0) {
                    square.classList.add('revealed'); square.innerHTML = total; score += parseInt(total); document.getElementById('score').innerText = score; 
                    spawnFloatingScore(square.offsetLeft, square.offsetTop, '+' + total); return;
                }
                checkSquare(square, square.id); square.classList.add('revealed'); score += 1; document.getElementById('score').innerText = score;
            }
            function checkSquare(square, currentId) {
                const isLeft = (currentId % width === 0); const isRight = (currentId % width === width -1);
                setTimeout(() => {

            function spawnParticles(x, y, c, count) { for(let i=0; i<count; i++) svParticles.push({ x:x, y:y, vx:(Math.random()-0.5)*200, vy:(Math.random()-0.5)*200, l:0.2+Math.random()*0.2, c:c }); }

            function fire(wId, lvl) {
                const s = svPlayer.stats; const isEvo = wId.startsWith('evo_'); const base = isEvo ? wId : wId; const d = DB.weapons[base];
                svPlayer.cds[wId] = (d.cd - (lvl * 0.04)) / s.hasteM; let dmg = d.dmg * s.dmgM * (1 + lvl * 0.2);
                if (wId === 'usb') { const t = getNearest(600); if (t) { let count = 1 + Math.floor(lvl/3); const dist = Math.hypot(t.x-svPlayer.x, t.y-svPlayer.y); const nx = (t.x-svPlayer.x)/dist, ny = (t.y-svPlayer.y)/dist; for(let i=0; i<count; i++) { const a = Math.atan2(ny,nx) + (i-(count-1)/2)*0.2; svProjectiles.push(new Projectile(svPlayer.x, svPlayer.y, Math.cos(a)*500, Math.sin(a)*500, wId, dmg, 1+Math.floor(lvl/4), 1.5)); } } }

                svGame.time += dt;

                enemyGrid.clear(); for (let i = 0; i < svEnemies.length; i++) enemyGrid.insert(svEnemies[i]);

                svPlayer.update(dt); runDirector(dt); svEnemies.forEach(e => e.update(dt));
                for(let i=svProjectiles.length-1; i>=0; i--) { svProjectiles[i].update(dt); if(svProjectiles[i].life<=0) svProjectiles.splice(i,1); }
                svItems.forEach(i => i.update(dt));
                for(let i=svParticles.length-1; i>=0; i--) { svParticles[i].x+=svParticles[i].vx*dt; svParticles[i].y+=svParticles[i].vy*dt; svParticles[i].l-=dt; if(svParticles[i].l<=0) svParticles.splice(i,1); }
                for(let i=svDamageTexts.length-1; i>=0; i--) { svDamageTexts[i].y-=40*dt; svDamageTexts[i].l-=dt; if(svDamageTexts[i].l<=0) svDamageTexts.splice(i,1); }
                checkColls(dt);

                ctx.fillStyle = document.body.classList.contains('light-theme') ? '#cbd5e0' : '#020617'; ctx.fillRect(0,0,cw,ch); 
                ctx.save();
                if(svGame.shake > 0) { ctx.translate((Math.random()-0.5)*10, (Math.random()-0.5)*10); svGame.shake -= dt; }
                ctx.translate(-camera.x, -camera.y);
                
                const startCX = Math.floor(camera.x / CHUNK_SIZE), endCX = Math.floor((camera.x+cw) / CHUNK_SIZE);
                const startCY = Math.floor(camera.y / CHUNK_SIZE), endCY = Math.floor((camera.y+ch) / CHUNK_SIZE);
                for(let cx = startCX; cx <= endCX; cx++) for(let cy = startCY; cy <= endCY; cy++) { const key = `${cx},${cy}`; if (!chunks.has(key)) chunks.set(key, new Chunk(cx, cy)); chunks.get(key).draw(ctx); }
                
                svItems.forEach(i => i.draw(ctx)); svPowerups.forEach(p => p.draw(ctx)); svProjectiles.forEach(p => p.draw(ctx));
                const drawables = [...svEnemies, svPlayer].sort((a,b) => a.y - b.y); drawables.forEach(d => d.draw(ctx));
                for(const p of svParticles) { ctx.fillStyle=p.c; ctx.globalAlpha=p.l/0.4; ctx.fillRect(p.x-2,p.y-2,4,4); }
                ctx.globalAlpha = 1;
                for(const d of svDamageTexts) { ctx.font = d.crit ? '900 24px Arial' : 'bold 16px Arial'; ctx.fillStyle = d.c; ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.globalAlpha = Math.max(0, d.l/0.8); ctx.strokeText(d.txt, d.x, d.y); ctx.fillText(d.txt, d.x, d.y); }
                ctx.globalAlpha = 1; ctx.restore();

                if(Math.floor(svGame.time) !== Math.floor(svGame.time-dt)) updateHUD();
                requestAnimationFrame(survivorLoop);
            }
            requestAnimationFrame(survivorLoop);
        }
    </script>
</body>
</html>
